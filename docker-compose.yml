name: wow-335a-website

x-app-environment: &app-environment
  APP_NAME: XVRX
  APP_ENV: local
  APP_KEY: "${DOCKER_APP_KEY:-base64:g8/FeB9JmASRhwDQpIf+u1glNDNo0Fhmals6+Ybcx5k=}"
  APP_DEBUG: "${APP_DEBUG:-true}"
  APP_URL: "${APP_URL:-http://localhost:8010}"
  APP_LOCALE: ru
  APP_FALLBACK_LOCALE: ru
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: wow_website
  DB_USERNAME: root
  DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-dev-root-password}"
  GAME_AUTH_DB_HOST: mysql
  GAME_AUTH_DB_PORT: 3306
  GAME_AUTH_DB_DATABASE: auth
  GAME_AUTH_DB_USERNAME: root
  GAME_AUTH_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-dev-root-password}"
  GAME_CHAR_DB_HOST: mysql
  GAME_CHAR_DB_PORT: 3306
  GAME_CHAR_DB_DATABASE: characters
  GAME_CHAR_DB_USERNAME: root
  GAME_CHAR_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-dev-root-password}"
  TRINITY_DB_HOST: mysql
  TRINITY_DB_PORT: 3306
  TRINITY_DB_DATABASE: characters
  TRINITY_DB_USERNAME: root
  TRINITY_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-dev-root-password}"
  CACHE_STORE: database
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "true"
  SESSION_DOMAIN: "null"
  SESSION_SECURE_COOKIE: "false"
  QUEUE_CONNECTION: database
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: local@example.test
  MAIL_FROM_NAME: XVRX Local
  CAPTCHA_METHOD: "false"
  SOAP_URL: http://soap-mock/soap
  SOAP_USER: local-admin
  SOAP_PASS: local-password
  SHOP_MAIL_SUBJECT: Shop
  SHOP_MAIL_BODY: Thank you for your purchase!
  YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
  YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
  YOOKASSA_BONUS_PER_RUBLE: "${YOOKASSA_BONUS_PER_RUBLE:-1}"
  YOOKASSA_MIN_AMOUNT: "${YOOKASSA_MIN_AMOUNT:-10}"
  YOOKASSA_MAX_AMOUNT: "${YOOKASSA_MAX_AMOUNT:-100000}"
  YOOKASSA_ALLOW_TEST_PAYMENTS: "${YOOKASSA_ALLOW_TEST_PAYMENTS:-true}"
  YOOKASSA_RECEIPT_ENABLED: "${YOOKASSA_RECEIPT_ENABLED:-false}"
  YOOKASSA_RECEIPT_VAT_CODE: "${YOOKASSA_RECEIPT_VAT_CODE:-1}"

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: wow-335a-website:local
  environment: *app-environment
  volumes:
    - .:/var/www/html
    - app_vendor:/var/www/html/vendor
    - app_storage:/var/www/html/storage
    - app_bootstrap_cache:/var/www/html/bootstrap/cache
    - public_uploads:/var/www/html/storage/app/public
    - public_uploads:/var/www/html/public/storage
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-dev-root-password}"
      MYSQL_DATABASE: wow_website
    ports:
      - "${MYSQL_FORWARD_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  soap-mock:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./docker/soap/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app-service
    restart: "no"
    command: ["/usr/local/bin/bootstrap-app"]
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      soap-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    <<: *app-service
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    <<: *app-service
    profiles: ["test"]
    restart: "no"
    environment:
      <<: *app-environment
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - test_bootstrap_cache:/var/www/html/bootstrap/cache
      - public_uploads:/var/www/html/storage/app/public
      - public_uploads:/var/www/html/public/storage
    command: ["sh", "-c", "php artisan optimize:clear && php artisan test"]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_FORWARD_PORT:-8010}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - public_uploads:/var/www/html/public/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  app_vendor:
  app_storage:
  app_bootstrap_cache:
  test_bootstrap_cache:
  public_uploads:
