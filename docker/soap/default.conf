server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location = /soap {
        default_type text/xml;
        return 200 '<?xml version="1.0"?><SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/"><SOAP-ENV:Body><executeCommandResponse xmlns="urn:TC"><result>Command executed successfully</result></executeCommandResponse></SOAP-ENV:Body></SOAP-ENV:Envelope>';
    }
}
